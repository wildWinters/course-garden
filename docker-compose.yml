version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-garden-frontend # ← тут без пробілу!
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - course-garden-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course-garden-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    networks:
      - course-garden-network

networks:
  course-garden-network:
    driver: bridge
